[package]
name = "irasu-illustrator"
version = "0.1.0"
edition = "2021"
description = "Adobe Illustrator alternative — Pure Rust + egui vector graphics editor with Animation Timeline & VFX integration"
license = "MIT"
authors = ["IRASU Contributors"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "persistence",
] }
egui = "0.31"
egui-wgpu = "0.31"
wgpu = { version = "24", features = ["naga-ir"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
kurbo = "0.11"
uuid = { version = "1.0", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
qrcode = { version = "0.14", default-features = false }
rhai = { version = "1.20", features = ["sync", "serde", "metadata"] }
toml = "0.8"
