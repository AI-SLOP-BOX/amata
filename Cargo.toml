[package]
name = "amata"
version = "0.1.0"
edition = "2021"
description = "Amata (数多) — Pure Rust + egui + wgpu professional vector graphics design studio"
license = "MIT"
authors = ["Amata Contributors"]

[lib]
name = "irasu_illustrator"
path = "src/lib.rs"

[[bin]]
name = "amata"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "persistence",
] }
egui = "0.31"
egui-wgpu = "0.31"
wgpu = { version = "24", features = ["naga-ir"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
kurbo = "0.11"
uuid = { version = "1.0", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
qrcode = { version = "0.14", default-features = false }
rhai = { version = "1.20", features = ["sync", "serde", "metadata"] }
toml = "0.8"
resvg = { version = "0.48", default-features = false, features = ["raster-images", "text"] }
fontdb = { version = "0.24", features = ["fs", "memmap"] }
ttf-parser = "0.25"
lopdf = "0.35"
flate2 = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

